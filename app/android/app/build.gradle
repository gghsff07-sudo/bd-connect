plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def keyProperties = new Properties()
def keyPropertiesFile = rootProject.file("key.properties")
if (keyPropertiesFile.exists()) {
    keyProperties.load(new FileInputStream(keyPropertiesFile))
}

android {
    namespace = "com.dbmonitor.db_monitor"
    // compileSdk 36 (Androidx.Work 2.11 pulled by workmanager 0.10 needs 35+;
    // 36 is also Flutter 3.47's default). targetSdk stays 34.
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        // flutter_local_notifications uses java.time APIs on minSdk 24
        coreLibraryDesugaringEnabled = true
    }

    // AGP 8 no longer generates BuildConfig by default; MainActivity reads
    // BuildConfig.VERSION_NAME for the in-app updater.
    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        applicationId = "com.dbmonitor.db_monitor"
        minSdkVersion = flutter.minSdkVersion
        targetSdk = 34
        versionCode = 6
        versionName = "2.4.0"
    }

    signingConfigs {
        release {
            if (keyPropertiesFile.exists()) {
                keyAlias = keyProperties['keyAlias']
                keyPassword = keyProperties['keyPassword']
                storeFile = keyProperties['storeFile'] ? file(keyProperties['storeFile']) : null
                storePassword = keyProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            signingConfig = keyPropertiesFile.exists() ? signingConfigs.release : null
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}

flutter {
    source = "../.."
}
