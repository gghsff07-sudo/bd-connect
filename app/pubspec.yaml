name: db_monitor
description: DB Monitor v2.4 - real-time widget with adjustable ring, in-app GitHub updates, WhatsApp-style local storage with cloud sync, Soft Day theme.
publish_to: "none"
version: 2.4.0+6

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.19.0
  shared_preferences: ^2.2.2
  workmanager: ^0.5.2
  flutter_local_notifications: ^17.2.1
  home_widget: ^0.6.0
  http: ^1.2.0
  sqflite: ^2.3.0
  path: ^1.9.0
  path_provider: ^2.1.2
  flutter_markdown: ^0.7.1
  video_player: ^2.8.2
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
